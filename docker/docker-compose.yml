services:
  service-registry:
    build:
      context: ../service-registry
      dockerfile: Dockerfile
    image: alb/service-registry:latest
    container_name: alb-eureka
    ports:
      - "8761:8761"
    environment:
      - SERVER_PORT=8761
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - alb-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s

  gateway:
    build:
      context: ../gateway
      dockerfile: Dockerfile
    image: alb/gateway:latest
    container_name: alb-gateway
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - EUREKA_HOST=service-registry
      - EUREKA_PORT=8761
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      service-registry:
        condition: service_healthy
    networks:
      - alb-net

  worker-1:
    build:
      context: ../demo-worker
      dockerfile: Dockerfile
    image: alb/demo-worker:latest
    container_name: alb-worker-1
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - EUREKA_HOST=service-registry
      - EUREKA_PORT=8761
      - EUREKA_METADATA_WEIGHT=5
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      service-registry:
        condition: service_healthy
    networks:
      - alb-net

  worker-2:
    build:
      context: ../demo-worker
      dockerfile: Dockerfile
    image: alb/demo-worker:latest
    container_name: alb-worker-2
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - EUREKA_HOST=service-registry
      - EUREKA_PORT=8761
      - EUREKA_METADATA_WEIGHT=3
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      service-registry:
        condition: service_healthy
    networks:
      - alb-net

  worker-3:
    build:
      context: ../demo-worker
      dockerfile: Dockerfile
    image: alb/demo-worker:latest
    container_name: alb-worker-3
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
      - EUREKA_HOST=service-registry
      - EUREKA_PORT=8761
      - EUREKA_METADATA_WEIGHT=1
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      service-registry:
        condition: service_healthy
    networks:
      - alb-net

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: alb-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    depends_on:
      - gateway
      - worker-1
      - worker-2
      - worker-3
    networks:
      - alb-net

  grafana:
    image: grafana/grafana:11.1.0
    container_name: alb-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - alb-net

networks:
  alb-net:
    driver: bridge

