global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: 'alb-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['alb-gateway:8080']
        labels:
          role: 'gateway'

  - job_name: 'alb-workers'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'alb-worker-1:8081'
          - 'alb-worker-2:8082'
          - 'alb-worker-3:8083'
        labels:
          role: 'worker'
